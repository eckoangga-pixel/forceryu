<!doctype html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Nusantara Air Force 3D</title><link rel="stylesheet" href="style.css"></head><body>
<section id="menu" class="screen active"><div class="skyfx"></div><div class="card">
<img class="hero" src="player.png"><h1>NUSANTARA AIR FORCE 3D</h1><p>Eduventure Indonesia</p>
<div class="grid"><label>Mode<select id="mode"><option value="1">Solo</option><option value="2">Duo</option><option value="4">Squad</option></select></label>
<label>Kelas<select id="grade"></select></label><label>Mapel<select id="subject"></select></label>
<label>Kesulitan<select id="difficulty"><option value="easy">Mudah</option><option value="medium">Sedang</option><option value="hard">Sulit</option></select></label></div>
<button id="start" class="primary">▶ MULAI MISI</button><button id="audio" class="secondary">🔊 AUDIO ON</button>
<div class="help">Geser pesawat untuk menghindar • ketuk/swipe ke musuh untuk menembak • laptop: WASD/panah + Space.</div>
<small>Game ini dibuat oleh : Eko Angga Purnomo, S.Pd.</small></div></section>
<section id="game" class="screen"><canvas id="c"></canvas><div id="hud"><span>⭐ <b id="score">0</b></span><span id="mission">Misi 1/10</span><span>❤️ <b id="hp">3</b></span><button id="pause">⏸</button><button id="back">⌂</button></div><div id="switch"></div></section>
<section id="pauseBox" class="overlay"><div class="dialog"><h2>⏸ Misi Dijeda</h2><button id="resume" class="primary">Lanjut</button><button class="secondary gohome">Menu Utama</button></div></section>
<section id="quiz" class="overlay"><div class="dialog"><div id="meta"></div><h2 id="question"></h2><div id="answers"></div><p id="why"></p><button id="next" class="primary hide">Lanjut Terbang ✈</button></div></section>
<section id="result" class="overlay"><div class="dialog center"><h1>🏆 MISI SELESAI</h1><div id="stars"></div><div id="final"></div><button id="again" class="primary">Main Lagi</button><button class="secondary gohome">Menu Utama</button></div></section>
<script src="game.js"></script></body></html>
